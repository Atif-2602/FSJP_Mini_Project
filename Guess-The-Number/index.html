<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guess The Number Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="wrapper">
        <div class="card">
            <h1>Guess The Number</h1>
            <p class="hint">I have selected a random number between 1 and 100</p>
            <div class="input-box">
                <input type="number" id="userGuess" placeholder="Enter your guess" min="1" max="100">
                <button id="checkBtn">Check</button>
            </div>
            <p id="message" class="message"></p>
            <p class="attempts">Attempts: <span id="attemptCount">0</span></p>
            <button id="playAgain" class="btn-restart hidden">Play Again</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
