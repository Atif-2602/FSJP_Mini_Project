<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guess The Number</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main">
        <div class="card">
            <h1>Guess The Number</h1>
            <p class="info">I have selected a random number between <span>1</span> and <span>100</span></p>
            <p class="sub">Can you guess it ?</p>

            <div class="input-box">
                <input type="number" id="userInput" placeholder="Enter your guess" min="1" max="100">
                <button id="checkBtn">Submit</button>
            </div>

            <p id="message" class="msg"></p>
            <p class="attempts">No. of Attempts : <span id="attempts">0</span></p>

            <button id="restart" class="restart-btn hidden">Try Again</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
